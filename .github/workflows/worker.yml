name: 보관 서버

# 자동 보관 서버(Cloudflare Worker, worker/) 테스트와 배포 (SPEC-006, #97)
# - PR 에서 worker/** 가 바뀌면: 테스트만 (main 보호 필수 체크 `test` 는 ci.yml, 이 워크플로는 별개)
# - main 에 worker/** 변경이 들어오면, 또는 Actions 에서 수동 실행하면: 테스트 → wrangler deploy → 내보내기 토큰 넣기(SPEC-011)
# 앱(GitHub Pages) 배포는 deploy.yml 이 따로 한다
on:
  pull_request:
    paths: ["worker/**", ".github/workflows/worker.yml"]
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: worker

jobs:
  worker-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
      - name: 타입 검사
        run: npm run typecheck
      - name: 테스트
        run: npm test

  deploy:
    needs: worker-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 배포가 겹치지 않게 한 줄로, 진행 중인 배포는 끊지 않는다
    concurrency:
      group: deploy-worker
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      # 비밀값이 아직 없으면 배포를 시도하지 않고 넣는 방법을 알려 준다 (값은 출력하지 않는다)
      - name: 비밀값 확인
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error title=보관 서버 배포 비밀값 없음::레포 Settings → Secrets and variables → Actions 에 다음 비밀값을 넣은 뒤 이 워크플로를 다시 실행(Run workflow)하세요:$missing"
            exit 1
          fi

      - name: 배포 (wrangler deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # 서버 밖 주간 사본(SPEC-011 2절)의 내보내기 토큰: 레포 비밀값 KEEP_EXPORT_TOKEN → Worker 비밀값 EXPORT_TOKEN.
      # 값은 표준 입력으로만 넘긴다(명령줄·로그에 남지 않게). 배포마다 넣어 레포 비밀값을 바꾸면 다음 배포에 따라간다.
      # 레포 비밀값이 없으면 경고만 하고 건너뛴다: 폰의 자동 보관 서버 배포를 내보내기 토큰 때문에 막지 않고,
      # 이미 넣은 Worker 비밀값은 배포해도 남는다. 내보내기가 안 되면 백업 레포 워크플로가 401 실패 메일을, 보관 지켜보기가 경고·실패를 준다
      - name: 내보내기 토큰 넣기
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KEEP_EXPORT_TOKEN: ${{ secrets.KEEP_EXPORT_TOKEN }}
        run: |
          if [ -z "$KEEP_EXPORT_TOKEN" ]; then
            echo "::warning title=내보내기 토큰 없음::레포 Settings → Secrets and variables → Actions → Secrets 에 KEEP_EXPORT_TOKEN(백업 레포 crowwan/dongari-keep-backup 의 비밀값 EXPORT_TOKEN 과 같은 값, CLAUDE.md '서버 밖 주간 사본')을 넣고 이 워크플로를 다시 실행(Run workflow)하면 Worker 비밀값 EXPORT_TOKEN 으로 들어가요. 이번 배포는 내보내기 토큰을 건드리지 않았어요"
            exit 0
          fi
          printf %s "$KEEP_EXPORT_TOKEN" | npx wrangler secret put EXPORT_TOKEN
