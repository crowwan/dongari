name: 보관 지켜보기

# 자동 보관이 밀리거나 서버가 죽었는지 하루 한 번 본다 (SPEC-007, ADR 006, #106)
# - 매일 UTC 0시(= KST 9시) + Actions 에서 수동 실행(Run workflow)
# - 보관 서버 요약(GET /v1/report)을 받아 scripts/keep-watch.mjs 가 판정한다
# - 문제가 있으면 실패로 끝나고 GitHub 가 실패 메일을 보낸다. 실행 요약(Job summary)에 기기별 표가 남는다
# - 레포에 60일 동안 활동이 없으면 GitHub 가 예약 실행을 멈춘다 → Actions 화면에서 다시 켠다(CLAUDE.md)
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 의존성이 없어 npm ci 는 하지 않는다
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # 비밀값·변수가 아직 없으면 서버를 부르지 않고 넣는 방법을 알려 준다 (값은 출력하지 않는다)
      - name: 비밀값 확인
        env:
          KEEP_REPORT_TOKEN: ${{ secrets.KEEP_REPORT_TOKEN }}
          KEEP_URL: ${{ vars.KEEP_URL }}
        run: |
          ok=true
          if [ -z "$KEEP_REPORT_TOKEN" ]; then
            echo "::error title=보관 지켜보기 비밀값 없음::레포 Settings → Secrets and variables → Actions → Secrets 에 KEEP_REPORT_TOKEN(Worker 비밀값 REPORT_TOKEN 과 같은 값, CLAUDE.md '요약 토큰')을 넣은 뒤 이 워크플로를 다시 실행(Run workflow)하세요"
            ok=false
          fi
          if [ -z "$KEEP_URL" ]; then
            echo "::error title=보관 지켜보기 변수 없음::레포 Settings → Secrets and variables → Actions → Variables 에 KEEP_URL(보관 서버 주소, 앱 배포와 같은 값)을 넣은 뒤 이 워크플로를 다시 실행(Run workflow)하세요"
            ok=false
          fi
          [ "$ok" = true ] || exit 1

      - name: 판정
        env:
          KEEP_REPORT_TOKEN: ${{ secrets.KEEP_REPORT_TOKEN }}
          KEEP_URL: ${{ vars.KEEP_URL }}
        run: node scripts/keep-watch.mjs
