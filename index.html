<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: 폰 키패드가 뜨면 화면(레이아웃)을 키패드만큼 줄여 아래 고정 [저장] 이 키패드 바로 위에 오게 한다
         (크롬 108+ 기본은 resizes-visual 이라 고정 영역이 키패드 뒤로 숨는다). 메타를 모르는 브라우저는 features/keyboard 가 받친다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />

    <title>동아리 회계 관리</title>
    <meta name="description" content="동아리 수입·지출을 한 줄씩 적으면 월 정리와 올해 결산을 만들어 주는 모바일 웹 앱" />

    <!-- Open Graph -->
    <meta property="og:title" content="동아리 회계 관리" />
    <meta property="og:description" content="동아리 수입·지출을 한 줄씩 적으면 월 정리와 올해 결산을 만들어 주는 모바일 웹 앱" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://crowwan.github.io/dongari/" />

    <!-- 탭 아이콘. 홈 화면 아이콘과 manifest 링크·서비스 워커 등록은 빌드 때 vite-plugin-pwa 가 넣는다 (src/pwa/pwaOptions.ts).
         iOS 전용 메타(apple-*)는 대상 기기(갤럭시)가 아니라 두지 않는다 (SPEC-002).
         / 로 시작하는 public 파일 경로는 빌드 때 Vite 가 빌드 경로(APP_BASE, vite.config.ts)를 앞에 붙인다 -->
    <link rel="icon" type="image/svg+xml" href="/dongari/icons/favicon.svg" />

    <!-- Theme Color: 주소창을 화면 바탕(tokens.css --bg)과 같게. HTML 에선 CSS 변수를 못 써 값을 옮겨 적는다 -->
    <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)" />
    <script type="module" crossorigin src="/dongari/assets/index-BzZWGuBv.js"></script>
    <link rel="stylesheet" crossorigin href="/dongari/assets/index-DDwStKJR.css">
  <link rel="manifest" href="/dongari/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/dongari/registerSW.js"></script></head>
  <body>
    <div id="root"></div>
  </body>
</html>
